# Cloudflare Worker configuration for the World of Warcards API. Infrastructure is code: this file is the
# source of truth, not the dashboard. Secrets never go here (use `wrangler secret put`).
#
# Secrets set with `wrangler secret put <name> --env <staging|production>`: TAPE_SECRET, ADMIN_TOKEN, DISCORD_CLIENT_SECRET.
# The Discord client id above is public (it is shown in the sign-in page's address); the secret never goes in this file.
#
# Both environments are created (roadmap B2). To set one up again:
#   npx wrangler d1 create warcards-staging      then paste the id here
#   npx wrangler d1 migrations apply warcards-staging --env staging --remote
#   npx wrangler deploy --env staging
name = "warcards-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[env.staging]
name = "warcards-api-staging"
vars = { MIN_CLIENT = "0.4.0", LATEST_APP = "0.4.5", LATEST_ADDON = "0.6.4", RELEASES_URL = "https://github.com/Imokim2/azeroth-card-binder/releases/latest", MIN_ADDON = "0.6.0", VERSION = "0.4.1", DISCORD_CLIENT_ID = "1569844563957260298", DISCORD_REDIRECT_URI = "http://127.0.0.1:53682/callback" }
d1_databases = [
  { binding = "DB", database_name = "warcards-staging", database_id = "adf8ffb3-8272-4962-98e8-6b9dba138532", migrations_dir = "migrations" },
]

# The test server's own address (a custom domain: Cloudflare makes the DNS record and the certificate).
routes = [{ pattern = "staging.worldofwarcards.co.uk", custom_domain = true }]
# The workers.dev address stays on too, so apps installed before the domain existed keep working.
workers_dev = true

# Once an hour: pair up trades and write off the ones nobody confirmed (src/maintenance.ts).
[env.staging.triggers]
crons = ["17 * * * *"]

# Rate limits per client address (src/limit.ts): a general one for everything and a strict one for register, reset,
# delete and the admin routes. Counted by Cloudflare, so they cost no database writes.
[[env.staging.ratelimits]]
name = "RATE_GENERAL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[env.staging.ratelimits]]
name = "RATE_STRICT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Keep the structured request log, so errors can be searched afterwards (docs/runbooks/ALERTS.md).
[env.staging.observability]
enabled = true

[env.production]
name = "warcards-api"
vars = { MIN_CLIENT = "0.4.0", LATEST_APP = "0.4.5", LATEST_ADDON = "0.6.4", RELEASES_URL = "https://github.com/Imokim2/azeroth-card-binder/releases/latest", MIN_ADDON = "0.6.0", VERSION = "0.4.1", DISCORD_CLIENT_ID = "1569844563957260298", DISCORD_REDIRECT_URI = "http://127.0.0.1:53682/callback", ACCESS_TEAM_DOMAIN = "worldofwarcards.cloudflareaccess.com", ACCESS_AUD = "d7bf3643e6acc740f9281439ef6e40cf3dc7dc5a7d7dcd3e12aee11ff944267b" }
d1_databases = [
  { binding = "DB", database_name = "warcards", database_id = "aafe20da-94e3-4011-b28c-5e88a125f741", migrations_dir = "migrations" },
]

# The real server's address: the website and the API are the same Worker, so one domain serves both.
routes = [
  { pattern = "worldofwarcards.co.uk", custom_domain = true },
  { pattern = "www.worldofwarcards.co.uk", custom_domain = true },
]
workers_dev = true

[env.production.triggers]
crons = ["17 * * * *"]

[[env.production.ratelimits]]
name = "RATE_GENERAL"
namespace_id = "2001"
simple = { limit = 120, period = 60 }

[[env.production.ratelimits]]
name = "RATE_STRICT"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[env.production.observability]
enabled = true
