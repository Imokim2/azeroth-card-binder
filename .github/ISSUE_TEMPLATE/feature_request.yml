name: An idea
description: Suggest something that would make World of Warcards better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the problem you have and what would help. Ideas that change how the ladder or Ranked drops work are weighed carefully, because they affect everyone's place.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
