name: Something is not working
description: The add-on, the companion app or the website is not doing what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You do not need to diagnose the problem. Tell us what happened and where; leave anything you do not know blank. Please do not paste your saved-data file or the companion's data folder: they can hold personal information.
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - The add-on (in the game)
        - The companion app (Windows)
        - The website
        - Not sure
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: Type `/acb version` in the game.
      placeholder: "1.0.13"
  - type: input
    id: companion-version
    attributes:
      label: Companion app version
      description: Shown at the bottom of the companion window.
      placeholder: "1.0.1"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The exact message you saw, what you were doing, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: location
    attributes:
      label: Where were you when it happened?
      description: For game issues, include the zone or dungeon and whether you were entering, leaving or on a flight path.
      placeholder: "Entering Razorfen Kraul"
  - type: dropdown
    id: loading-recovery
    attributes:
      label: If the game flickered to the desktop during loading, what helped?
      description: Optional. Try typing /reload if chat still responds; this has recovered an affected session, but is not guaranteed to work.
      options:
        - Not applicable
        - Typing /reload let it finish loading
        - Closing and restarting the game
        - Pressing Escape
        - Nothing yet
        - Not sure
  - type: textarea
    id: log
    attributes:
      label: Support details or diagnostic lines (optional)
      description: Settings > Help > Report a bug adds basic support details. For drops, kills, whispers or trading, you can also type `/acb diag`, repeat the problem, then copy the relevant lines from `/acb log`.
      render: text
  - type: dropdown
    id: mode
    attributes:
      label: Which mode were you playing?
      options:
        - Casual
        - Ranked
        - Not sure
