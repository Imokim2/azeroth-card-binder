name: Release

# Pushing a tag that starts with "v" (for example v0.5.0) builds the add-on ZIP and the Windows installer and attaches both, with
# their SHA-256 checksums, to a GitHub release. The release key never goes into GitHub. (The installer is signed by SignPath
# once that is set up, see the steps in the installer job; the manifest for the companion app is still signed on the maintainer's computer.) After the release
# exists, sign it on the maintainer's computer (docs/runbooks/RELEASES.md, `node tools/release-manifest.js sign`) so the companion
# app will install it, and deploy the server.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install LuaJIT and zip
        run: sudo apt-get update && sudo apt-get install -y luajit zip
      - name: Type-check, check, test and build the add-on ZIP
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: cd server && npm ci && npm run typecheck && cd ../app && npm ci && npm run typecheck && cd .. && node tools/release.js build
      - uses: actions/upload-artifact@v4
        with:
          name: addon-zip
          path: dist/AzerothCardBinder-*.zip
          if-no-files-found: error

  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the installer
        working-directory: app
        run: |
          npm ci
          node --test test/updatePreservation.test.ts
          npm run dist
      - name: Test native installer process detection
        working-directory: app
        env:
          WARCARDS_REQUIRE_INSTALLER_TESTS: "1"
        run: node --test test/installerProcess.test.ts
      # Free code signing from SignPath Foundation (docs/CODE-SIGNING.md). These steps do nothing until the repository
      # variable SIGNPATH_ORGANIZATION_ID is set (Settings, Secrets and variables, Actions, Variables) and the secret
      # SIGNPATH_API_TOKEN exists. Each signing request must then be approved by hand in SignPath before the release goes on.
      - name: Keep the unsigned installer for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: app/release/World-of-Warcards-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed/*.exe' || 'app/release/World-of-Warcards-Setup-*.exe' }}
          if-no-files-found: error

  publish:
    needs: [addon, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" files/* --title "$TAG" --notes "See CHANGELOG.md for what changed. The installer is not code-signed yet, so Windows may warn about an unknown publisher; check downloads against SHA256SUMS.txt."
